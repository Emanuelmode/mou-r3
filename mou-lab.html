<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOU · Laboratorio</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{margin:0;background:#07070d;color:#eef2ff;font-family:system-ui;padding:35px}main{max-width:1000px;margin:auto}a{color:#8b7cff}.panel{padding:25px;border:1px solid #252632;border-radius:18px;background:#10111a}label{display:block;margin:18px 0;color:#aab2c0}input{width:100%}#plot{height:520px}</style></head><body><main><p><a href="index.html">← MOU</a></p><h1>Laboratorio MOU</h1><p>Exploración visual de escala, ruido y legibilidad. No constituye validación del framework.</p><div class="panel"><label>Ruido <input id="noise" type="range" min="0" max="1" step=".01" value=".25"></label><label>Escala observacional ε <input id="eps" type="range" min=".05" max="2" step=".01" value=".7"></label><div id="plot"></div></div></main><script>function draw(){let n=+noise.value,e=+eps.value,x=Array.from({length:500},(_,i)=>i/35),y=x.map(v=>Math.sin(v*1.7)+.3*Math.sin(v*4)+n*(Math.random()-.5));Plotly.react('plot',[{x,y,mode:'lines',line:{color:'#8b7cff'}}],{paper_bgcolor:'transparent',plot_bgcolor:'transparent',font:{color:'#b7bfcc'},margin:{l:45,r:20,t:20,b:40},title:'Representación exploratoria · ε = '+e.toFixed(2)},{responsive:true,displayModeBar:false})}noise.oninput=draw;eps.oninput=draw;draw();</script></body></html>
